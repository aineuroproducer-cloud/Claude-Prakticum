# Выкладка сайта на хостинг Рег.ру по FTP при каждом изменении в main.
# Нужны секреты репозитория: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_DIR (папка сайта на хостинге, с / на конце).
name: Выкладка на Рег.ру
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Проверить, что доступы заданы
        id: check
        env:
          S: ${{ secrets.FTP_SERVER }}
        run: if [ -z "$S" ]; then echo "Секреты FTP ещё не заданы — пропускаю"; echo "ok=false" >> $GITHUB_OUTPUT; else echo "ok=true" >> $GITHUB_OUTPUT; fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'
      - name: Выложить по FTP
        if: steps.check.outputs.ok == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            legal/**
            README.md
            vercel.json
